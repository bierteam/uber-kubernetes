---
# https://postfinance.github.io/topf/main/configuration/
clusterName: talos-cluster
clusterEndpoint: https://[2a05:f080:0:3800:beef::]:6443
kubernetesVersion: v1.37.0
talosVersion: v1.14.0
patchesDir: patches

data:
  link: ens18

nodes:
  # The control planes are SecureBoot VMs with a TPM, so they get the secureboot
  # installer and the qemu-guest-agent schematic. talos4 is bare metal running the
  # plain metal-installer image, which is why secureboot/schematicId are set per
  # node instead of cluster-wide.
  - host: talos1
    ip: 2a05:f080:0:3800:be24:11ff:fe6c:6e3d
    role: control-plane
    secureboot: true
    schematicId: "@schematic.yaml"
  - host: talos2
    ip: 2a05:f080:0:3800:be24:11ff:fe19:44f
    role: control-plane
    secureboot: true
    schematicId: "@schematic.yaml"
  - host: talos3
    ip: 2a05:f080:0:3800:be24:11ff:fe64:a994
    role: control-plane
    secureboot: true
    schematicId: "@schematic.yaml"
  - host: talos4
    ip: 2a05:f080:0:3800:56bf:64ff:fe93:5e26
    role: worker
    data:
      link: enp1s0
