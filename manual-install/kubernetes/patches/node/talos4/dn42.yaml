---
# DN42 router. The tunnels live in vrf-dn42, whose table only leads to OPNsense,
# so traffic from DN42 can't reach the node, the cluster or the LAN directly.
apiVersion: v1alpha1
kind: LinkConfig
name: enp1s0
routes:
  - destination: fd69:420:cafe::/48
    gateway: fe80::7c13:c1ff:fea5:6338 # OPNsense, the only way out of vrf-dn42
    table: "42"
---
apiVersion: v1alpha1
kind: VRFConfig
name: vrf-dn42
table: "42"
# The wg-* tunnels are created in this VRF by dn42-operator (argocd-managed/dn42-router),
# marked with alias managed-by=dn42-operator; Talos leaves them alone.
links:
  - dn42-lo
---
# The router's own address inside vrf-dn42, for the multihop session to the
# route collector and for ping/traceroute. The /128 is more specific than the
# /48 towards OPNsense, so packets for it are delivered locally.
apiVersion: v1alpha1
kind: DummyLinkConfig
name: dn42-lo
addresses:
  - address: fd69:420:cafe:ffff::1/128
---
# Everything arriving from the tunnels is looked up in table 42 only. Cilium
# puts the local table at pref 100, before the l3mdev rule (1000), so without
# this a peer could reach the node's own addresses (apid, kubelet) through a
# tunnel, and replies to talos4's pods (masqueraded to the node's
# fd69:420:cafe:1:: address) would be delivered to the host instead of going
# back via OPNsense into enp1s0, where Cilium undoes the masquerade. The VRF's
# own addresses (tunnel fe80s, dn42-lo) are local routes in table 42 itself.
apiVersion: v1alpha1
kind: RoutingRuleConfig
name: "90"
iifName: vrf-dn42
table: "42"
---
# Only traffic forwarded by OPNsense goes into vrf-dn42. talos4's own pods
# reach DN42 via the default route like on the other nodes (masqueraded to the
# node's fd69:420:cafe:1:: address, routed back here by OPNsense), instead of
# leaving the tunnels with a pod address. Pod and service traffic from the
# other nodes stays in the main table.
apiVersion: v1alpha1
kind: RoutingRuleConfig
name: "200"
iifName: enp1s0
dst: fd05:4786:835f::/48
table: main
---
apiVersion: v1alpha1
kind: RoutingRuleConfig
name: "201"
iifName: enp1s0
dst: fd26:4340:84fe::/112
table: main
---
apiVersion: v1alpha1
kind: RoutingRuleConfig
name: "210"
iifName: enp1s0
dst: fd00::/8
table: "42"
---
# Catch-all for table 42. Without it, lookups that miss the VRF table fall
# through to the main table, letting peers route into the LAN and pod networks.
# Talos has no unreachable routes, so the default goes into a dummy link, which
# drops everything.
apiVersion: v1alpha1
kind: DummyLinkConfig
name: dn42-null
routes:
  - gateway: fe80::1
    metric: 4278198272
    table: "42"
