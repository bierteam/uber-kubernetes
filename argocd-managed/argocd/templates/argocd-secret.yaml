---
# This has a chicken and egg problem yet to be resolved
# Sealed secrets will need te be installed and the private keys restored from backup
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-secret
  namespace: argocd
spec:
  encryptedData:
    # ID list of the homeassistant account's API tokens (not the tokens themselves).
    # ArgoCD rejects tokens whose ID is missing here; see argocd-managed/talos5-power/README.md.
    accounts.homeassistant.tokens: 
    server.secretkey: 
