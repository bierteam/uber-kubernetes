---
# ArgoCD cluster secret for the talos cluster (bearer token of the argocd-manager
# service account created by `argocd cluster add`). The labels end up on the
# unsealed secret and select which ApplicationSets deploy here, see
# argocd-apps/templates/applicationset-template.yaml.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: talos-cluster
  namespace: argocd
spec:
  encryptedData:
    config: 
    name: 
    server: 
  template:
    metadata:
      labels:
        apps.oscarr.nl/cert-manager: "true"
        apps.oscarr.nl/gateway-api: "true"
        argocd.argoproj.io/secret-type: cluster
      name: talos-cluster
      namespace: argocd
    type: Opaque
