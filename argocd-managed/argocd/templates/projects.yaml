---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
  annotations:
    helm.sh/resource-policy: keep
spec:
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  destinations:
    - namespace: "*"
      name: in-cluster
    - namespace: "*"
      name: talos-cluster
    - namespace: "*"
      name: unds
  orphanedResources:
    warn: false
  # Scoped to the minecraft app via the applications selector, so no separate
  # project is needed. Note this is an allow window: outside it, automated syncs
  # for that app are blocked entirely -- including selfHeal, so drift sits until
  # the next window. manualSync lets you push a change through in the meantime.
  syncWindows:
    - kind: allow
      schedule: "0 3 * * *"
      duration: 2h
      timeZone: Europe/Amsterdam
      applications:
        - minecraft
      manualSync: true
  sourceRepos:
    - https://github.com/bierteam/uber-kubernetes.git
    - https://github.com/bierteam/drinkn.git
    - https://github.com/bierteam/wildlife-api.git
    - https://github.com/bierteam/wildlife-frontend.git
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: restricted
  namespace: argocd
spec:
  destinations:
    - name: in-cluster
      namespace: drinkn-pr-*
    - name: in-cluster
      namespace: drinkn-hooks
  clusterResourceBlacklist:
    - group: "*"
      kind: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: "Namespace"
      name: drinkn-pr-*
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
  sourceRepos:
    - https://github.com/bierteam/drinkn.git
