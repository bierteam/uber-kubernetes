minecraft-survival:
  minecraftServer:
    eula: "TRUE"
    type: "PAPER"
    # Reachable only in-cluster; Velocity is the public entrypoint and holds the
    # LoadBalancer address. Do not expose this directly: with Velocity forwarding
    # the backend trusts whatever identity the proxy asserts.
    serviceType: ClusterIP
    # Velocity authenticates against Mojang instead, which is what modern
    # forwarding requires.
    onlineMode: false
    rcon:
      enabled: true
      existingSecret: minecraft-rcon-password
      secretKey: rcon-password

  persistence:
    storageClass: nfs-retain
    dataDir:
      enabled: true
      Size: 10Gi
      accessModes:
        - ReadWriteOnce
  extraEnv:
    PREFER_IPV6: "true"
    PATCH_DEFINITIONS: /patches
    # Read from a Secret rather than set here: this repo is public, and the
    # forwarding secret is what lets the proxy assert player identities.
    CFG_VELOCITY_SECRET:
      valueFrom:
        secretKeyRef:
          name: minecraft-velocity
          key: forwarding-secret
  # Paper only reads the Velocity settings from paper-global.yml, so they are
  # patched in at startup. The secret is interpolated from CFG_VELOCITY_SECRET
  # above, so it never lands in git.
  extraDeploy:
    - |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: minecraft-paper-patches
      data:
        paper-global.json: |-
          {
            "file": "/data/config/paper-global.yml",
            "ops": [
              {
                "$set": {
                  "path": "$.proxies.velocity.enabled",
                  "value": "true",
                  "value-type": "bool"
                }
              },
              {
                "$set": {
                  "path": "$.proxies.velocity['online-mode']",
                  "value": "true",
                  "value-type": "bool"
                }
              },
              {
                "$set": {
                  "path": "$.proxies.velocity.secret",
                  "value": "${CFG_VELOCITY_SECRET}"
                }
              }
            ]
          }
  # Literal name on purpose: extraVolumes is rendered with plain toYaml, not
  # tplRender, so template functions do not work here.
  extraVolumes:
    - volumeMounts:
        - name: paper-patches
          mountPath: /patches
          readOnly: true
      volumes:
        - name: paper-patches
          configMap:
            name: minecraft-paper-patches

  mcbackup:
    enabled: true
    backupInterval: 6h
    pauseIfNoPlayers: "true"
    pruneBackupsDays: 14
    excludes: "*.jar,cache,logs"
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
    persistence:
      storageClass: nfs-retain
      backupDir:
        enabled: true
        Size: 20Gi
        # RWX so the creative server can mount the same backups read-only. With
        # RWO the two pods can only ever run on the same node.
        accessModes:
          - ReadWriteMany

# Backup sandbox: same world, wiped and re-restored from the survival backups
# on every pod start. templates/backup-world-reset-cron.yaml triggers that daily.
minecraft-backup:
  minecraftServer:
    eula: "TRUE"
    type: "PAPER"
    gameMode: creative
    motd: "Backup sandbox -- reset daily from backup"
    serviceType: ClusterIP
    onlineMode: false
    # Nothing here is worth backing up, so no rcon consumer and no mcbackup.
    rcon:
      enabled: false
  persistence:
    # Disposable by design, so the Delete class rather than nfs-retain.
    storageClass: nfs-deletable
    dataDir:
      enabled: true
      Size: 10Gi
      accessModes:
        - ReadWriteOnce
  extraEnv:
    PREFER_IPV6: "true"
    PATCH_DEFINITIONS: /patches
    CFG_VELOCITY_SECRET:
      valueFrom:
        secretKeyRef:
          name: minecraft-velocity
          key: forwarding-secret
  # Wipes /data and unpacks the newest survival backup. The archive is rooted at
  # ./ relative to /data, so it restores the whole server directory. Nothing to
  # restore is not an error -- the server then just boots a fresh world.
  initContainers:
    - |
      name: restore-from-backup
      image: busybox:1.38
      command:
        - sh
        - -c
        - |
          set -eu
          latest=$(ls -1t /backups/*.tar.gz 2>/dev/null | head -1 || true)
          if [ -z "${latest:-}" ]; then
            echo "no survival backup found; leaving /data as-is"
            exit 0
          fi
          echo "restoring from ${latest}"
          find /data -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -xzf "${latest}" -C /data

          # Op everyone who has ever joined survival. usercache.json is the only
          # record of that, and it comes along in the backup, so the op list
          # maintains itself instead of being a hand-kept list in values.
          # Guarded so an empty or missing usercache leaves ops.json untouched
          # rather than writing invalid JSON.
          if [ -f /data/usercache.json ]; then
            entries=$(tr '}' '\n' < /data/usercache.json | while IFS= read -r line; do
              u=$(printf '%s' "$line" | sed -n 's/.*"uuid":"\([^"]*\)".*/\1/p')
              n=$(printf '%s' "$line" | sed -n 's/.*"name":"\([^"]*\)".*/\1/p')
              if [ -n "$u" ] && [ -n "$n" ]; then
                printf '{"uuid":"%s","name":"%s","level":4,"bypassesPlayerLimit":false},' "$u" "$n"
              fi
            done)
            if [ -n "$entries" ]; then
              printf '[%s]' "${entries%,}" > /data/ops.json
              echo "opped everyone found in usercache"
            fi
          fi
          echo "restore complete"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: survival-backups
          mountPath: /backups
          readOnly: true
        - name: datadir
          mountPath: /data
  # Reuses the ConfigMap created by the survival release; same namespace.
  extraVolumes:
    - volumeMounts:
        - name: paper-patches
          mountPath: /patches
          readOnly: true
      volumes:
        - name: paper-patches
          configMap:
            name: minecraft-paper-patches
        - name: survival-backups
          persistentVolumeClaim:
            claimName: minecraft-minecraft-survival-backupdir
            readOnly: true

# Skyblock. Own persistent world and its own backup series -- islands players
# build are worth keeping, unlike the backup sandbox.
minecraft-skyblock:
  minecraftServer:
    eula: "TRUE"
    type: "PAPER"
    motd: "Skyblock"
    serviceType: ClusterIP
    onlineMode: false
    # BSkyBlock, the usual pick, has no 26.2 build yet and a 26.2 client cannot
    # join an older backend through Velocity. IridiumSkyblock is standalone, so
    # no BentoBox needed, and it generates its own island world on first start.
    modrinth:
      projects:
        - iridiumskyblock
        # Hard dependency of IridiumSkyblock that downloadDependencies does not
        # pull, because Modrinth does not list it as one -- without it the plugin
        # fails to load with UnknownDependencyException: [Vault].
        # VaultUnlocked is the maintained fork and the only one with a 26.2
        # build; its plugin.yml declares "name: Vault", so it satisfies the
        # dependency by name.
        - vaultunlocked
      downloadDependencies: required
    # Shares the survival rcon secret; mcbackup below needs rcon to flush the
    # world before archiving.
    rcon:
      enabled: true
      existingSecret: minecraft-rcon-password
      secretKey: rcon-password
  persistence:
    storageClass: nfs-retain
    dataDir:
      enabled: true
      Size: 10Gi
      accessModes:
        - ReadWriteOnce
  extraEnv:
    PREFER_IPV6: "true"
    PATCH_DEFINITIONS: /patches
    CFG_VELOCITY_SECRET:
      valueFrom:
        secretKeyRef:
          name: minecraft-velocity
          key: forwarding-secret
  # Reuses the ConfigMap created by the survival release; same namespace.
  extraVolumes:
    - volumeMounts:
        - name: paper-patches
          mountPath: /patches
          readOnly: true
      volumes:
        - name: paper-patches
          configMap:
            name: minecraft-paper-patches
  mcbackup:
    enabled: true
    backupInterval: 6h
    pauseIfNoPlayers: "true"
    pruneBackupsDays: 14
    excludes: "*.jar,cache,logs"
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
    persistence:
      storageClass: nfs-retain
      backupDir:
        enabled: true
        Size: 20Gi
        accessModes:
          - ReadWriteOnce

# Wrapper-chart values, consumed by templates/backup-world-reset-cron.yaml.
backupWorldReset:
  enabled: true
  # 05:00 local, before anyone is likely online -- a reset kicks players off.
  schedule: "0 5 * * *"
  timeZone: "Europe/Amsterdam"
  deployment: minecraft-minecraft-backup

# Wrapper-chart values, consumed by templates/proxy-lb-svc.yaml.
proxyLoadBalancer:
  enabled: true
  ip: "2a05:f080:0:3800:1b::1"
  port: 25580
  # Label the minecraft-proxy chart puts on its pods: app: <release>-minecraft-proxy.
  selectorApp: minecraft-minecraft-proxy

minecraft-proxy:
  minecraftProxy:
    type: VELOCITY
    # Pinned, not "latest": that resolved to 4.1.0-SNAPSHOT, a development build.
    # 4.0.0 is the stable release of the same line. Do not drop to 3.x -- Paper
    # here runs MC 26.2 and the 3.x protocol support predates it.
    velocityVersion: "4.0.0"
    onlineMode: true
    # The chart hardcodes port 25565 on its own Service with no value to change
    # it, so that one stays internal and templates/proxy-lb-svc.yaml provides the
    # public LoadBalancer on the port we actually want.
    serviceType: ClusterIP
    configFilePath: /server/velocity.toml
    config: |-
      config-version = "2.8"
      bind = "[::]:25577"
      motd = "Welcome to Minecraft on Kubernetes!"
      show-max-players = 20
      player-info-forwarding-mode = "modern"
      forwarding-secret-file = "/server/forwarding.secret"
      # Routes a hostname straight to one server, so players skip /server. Matched
      # against the address the client used in its handshake, which is why each of
      # these has its own SRV record pointing at itself in misc/dns.yaml.
      # mc and vanilla are deliberately absent: they fall through to try below.
      [forced-hosts]
      "survival.doktermarjolein.nl" = ["survival"]
      "backup.doktermarjolein.nl" = ["backup"]
      "skyblock.doktermarjolein.nl" = ["skyblock"]
      [servers]
      survival = "minecraft-minecraft-survival:25565"
      backup = "minecraft-minecraft-backup:25565"
      skyblock = "minecraft-minecraft-skyblock:25565"
      try = ["survival"]

  extraEnv:
    JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv6Addresses=true"
  extraVolumes:
    - volumeMounts:
        - name: velocity-forwarding-secret
          mountPath: /server/forwarding.secret
          subPath: forwarding.secret
          readOnly: true
      volumes:
        - name: velocity-forwarding-secret
          secret:
            secretName: minecraft-velocity
            items:
              - key: forwarding-secret
                path: forwarding.secret

rcon-web-admin:

