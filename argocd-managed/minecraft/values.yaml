minecraft:
  minecraftServer:
    eula: "TRUE"
    type: "PAPER"
    # Reachable only in-cluster; Velocity is the public entrypoint and holds the
    # LoadBalancer address. Do not expose this directly: with Velocity forwarding
    # the backend trusts whatever identity the proxy asserts.
    serviceType: ClusterIP
    # Velocity authenticates against Mojang instead, which is what modern
    # forwarding requires.
    onlineMode: false
    rcon:
      enabled: true
      existingSecret: minecraft-rcon-password
      secretKey: rcon-password

  persistence:
    storageClass: nfs-retain
    dataDir:
      enabled: true
      Size: 10Gi
      accessModes:
        - ReadWriteOnce
  extraEnv:
    PREFER_IPV6: "true"
    PATCH_DEFINITIONS: /patches
    # Read from a Secret rather than set here: this repo is public, and the
    # forwarding secret is what lets the proxy assert player identities.
    CFG_VELOCITY_SECRET:
      valueFrom:
        secretKeyRef:
          name: minecraft-velocity
          key: forwarding-secret
  # Paper only reads the Velocity settings from paper-global.yml, so they are
  # patched in at startup. The secret is interpolated from CFG_VELOCITY_SECRET
  # above, so it never lands in git.
  extraDeploy:
    - |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: minecraft-paper-patches
      data:
        paper-global.json: |-
          {
            "file": "/data/config/paper-global.yml",
            "ops": [
              {
                "$set": {
                  "path": "$.proxies.velocity.enabled",
                  "value": "true",
                  "value-type": "bool"
                }
              },
              {
                "$set": {
                  "path": "$.proxies.velocity['online-mode']",
                  "value": "true",
                  "value-type": "bool"
                }
              },
              {
                "$set": {
                  "path": "$.proxies.velocity.secret",
                  "value": "${CFG_VELOCITY_SECRET}"
                }
              }
            ]
          }
  # Literal name on purpose: extraVolumes is rendered with plain toYaml, not
  # tplRender, so template functions do not work here.
  extraVolumes:
    - volumeMounts:
        - name: paper-patches
          mountPath: /patches
          readOnly: true
      volumes:
        - name: paper-patches
          configMap:
            name: minecraft-paper-patches

  mcbackup:
    enabled: true
    backupInterval: 6h
    pauseIfNoPlayers: "true"
    pruneBackupsDays: 14
    excludes: "*.jar,cache,logs"
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
    persistence:
      storageClass: nfs-retain
      backupDir:
        enabled: true
        Size: 20Gi
        # RWX so the creative server can mount the same backups read-only. With
        # RWO the two pods can only ever run on the same node.
        accessModes:
          - ReadWriteMany

# Creative sandbox: same world, wiped and re-restored from the survival backups
# on every pod start. templates/creative-restore-cron.yaml triggers that daily.
minecraft-creative:
  minecraftServer:
    eula: "TRUE"
    type: "PAPER"
    gameMode: creative
    motd: "Creative sandbox -- reset daily from backup"
    serviceType: ClusterIP
    onlineMode: false
    # Nothing here is worth backing up, so no rcon consumer and no mcbackup.
    rcon:
      enabled: false
  persistence:
    # Disposable by design, so the Delete class rather than nfs-retain.
    storageClass: nfs-deletable
    dataDir:
      enabled: true
      Size: 10Gi
      accessModes:
        - ReadWriteOnce
  extraEnv:
    PREFER_IPV6: "true"
    PATCH_DEFINITIONS: /patches
    CFG_VELOCITY_SECRET:
      valueFrom:
        secretKeyRef:
          name: minecraft-velocity
          key: forwarding-secret
  # Wipes /data and unpacks the newest survival backup. The archive is rooted at
  # ./ relative to /data, so it restores the whole server directory. Nothing to
  # restore is not an error -- the server then just boots a fresh world.
  initContainers:
    - |
      name: restore-from-backup
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          set -eu
          latest=$(ls -1t /backups/*.tar.gz 2>/dev/null | head -1 || true)
          if [ -z "${latest:-}" ]; then
            echo "no survival backup found; leaving /data as-is"
            exit 0
          fi
          echo "restoring from ${latest}"
          find /data -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -xzf "${latest}" -C /data
          echo "restore complete"
      # The namespace enforces the restricted Pod Security profile, and this spec
      # is ours rather than the chart's, so it needs its own securityContext.
      # uid 1000 matches the server's own user; the NFS share is mode 0777.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: survival-backups
          mountPath: /backups
          readOnly: true
        - name: datadir
          mountPath: /data
  # Reuses the ConfigMap created by the survival release; same namespace.
  extraVolumes:
    - volumeMounts:
        - name: paper-patches
          mountPath: /patches
          readOnly: true
      volumes:
        - name: paper-patches
          configMap:
            name: minecraft-paper-patches
        - name: survival-backups
          persistentVolumeClaim:
            claimName: minecraft-backupdir
            readOnly: true

# Wrapper-chart values, consumed by templates/creative-restore-cron.yaml.
creativeReset:
  enabled: true
  # 05:00 local, before anyone is likely online -- a reset kicks players off.
  schedule: "0 5 * * *"
  timeZone: "Europe/Amsterdam"
  deployment: minecraft-minecraft-creative

# Wrapper-chart values, consumed by templates/proxy-lb-svc.yaml.
proxyLoadBalancer:
  enabled: true
  ip: "2a05:f080:0:3800:1b::1"
  port: 25580
  # Label the minecraft-proxy chart puts on its pods: app: <release>-minecraft-proxy.
  selectorApp: minecraft-minecraft-proxy

minecraft-proxy:
  minecraftProxy:
    type: VELOCITY
    # Pinned, not "latest": that resolved to 4.1.0-SNAPSHOT, a development build.
    # 4.0.0 is the stable release of the same line. Do not drop to 3.x -- Paper
    # here runs MC 26.2 and the 3.x protocol support predates it.
    velocityVersion: "4.0.0"
    onlineMode: true
    # The chart hardcodes port 25565 on its own Service with no value to change
    # it, so that one stays internal and templates/proxy-lb-svc.yaml provides the
    # public LoadBalancer on the port we actually want.
    serviceType: ClusterIP
    configFilePath: /server/velocity.toml
    config: |-
      config-version = "2.8"
      bind = "[::]:25577"
      motd = "Welcome to Minecraft on Kubernetes!"
      show-max-players = 20
      player-info-forwarding-mode = "modern"
      forwarding-secret-file = "/server/forwarding.secret"
      [forced-hosts]
      [servers]
      main = "minecraft:25565"
      creative = "minecraft-minecraft-creative:25565"
      try = ["main"]

  extraEnv:
    JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv6Addresses=true"
  extraVolumes:
    - volumeMounts:
        - name: velocity-forwarding-secret
          mountPath: /server/forwarding.secret
          subPath: forwarding.secret
          readOnly: true
      volumes:
        - name: velocity-forwarding-secret
          secret:
            secretName: minecraft-velocity
            items:
              - key: forwarding-secret
                path: forwarding.secret

rcon-web-admin:

