minecraft:
  minecraftServer:
    eula: "TRUE"
    type: "PAPER"
    serviceType: LoadBalancer
    rcon:
      enabled: true
      withGeneratedPassword: true

  persistence:
    storageClass: nfs-retain
    dataDir:
      enabled: true
      Size: 10Gi
      accessModes:
        - ReadWriteOnce
  extraEnv:
    PREFER_IPV6: "true"

  mcbackup:
    enabled: true
    backupInterval: 6h
    pauseIfNoPlayers: "true"
    pruneBackupsDays: 14
    excludes: "*.jar,cache,logs"
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
    persistence:
      storageClass: nfs-retain
      backupDir:
        enabled: true
        Size: 20Gi
        accessModes:
          - ReadWriteOnce

rcon-web-admin:

