{{- if .Values.backupWorldReset.enabled }}
# The restore itself lives in the creative pod's initContainer, so a daily reset
# is just a pod replacement. Recreate is the chart's strategy, so the old pod is
# gone before the new one restores -- no two writers on the same volume.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minecraft-backup-world-reset
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minecraft-backup-world-reset
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ .Values.backupWorldReset.deployment | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minecraft-backup-world-reset
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minecraft-backup-world-reset
subjects:
  - kind: ServiceAccount
    name: minecraft-backup-world-reset
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minecraft-backup-world-reset
spec:
  schedule: {{ .Values.backupWorldReset.schedule | quote }}
  timeZone: {{ .Values.backupWorldReset.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: minecraft-backup-world-reset
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.36.4
              command:
                - kubectl
                - rollout
                - restart
                - deployment/{{ .Values.backupWorldReset.deployment }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
{{- end }}
