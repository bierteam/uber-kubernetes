# Everything that has to sit next to bird on talos4, in the host network: the
# looking glass proxy (BIRD's socket, traceroutes bound to vrf-dn42) and the
# exporters VictoriaMetrics scrapes. The frontend runs on the pod network
# (frontend.yaml), where whois.dn42 and asn.dn42 are reachable; the proxy only
# accepts it (from talos1-3's addresses) and the node itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
spec:
  replicas: 1
  # host ports, so the old pod has to go first
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      nodeSelector:
        kubernetes.io/hostname: talos4
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: xddxdd/bird-lgproxy-go:v1.4.8@sha256:1fbd3cd6a1b500cd3146d99d5db15457750fd73951479bf9f12eb1329775642c
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: BIRD_SOCKET
              value: /var/run/bird/bird.ctl
            # on the node address that nl-hou01.dn42.oscarr.nl points at, for the
            # frontend (frontend.yaml) only. It runs on talos1-3 and arrives
            # masqueraded to its node's address: those, plus talos4 itself.
            - name: BIRDLG_LISTEN
              value: "[$(HOST_IP)]:8000"
            - name: ALLOWED_IPS
              value: $(HOST_IP),2a05:f080:0:3800::1000,2a05:f080:0:3800::1001,2a05:f080:0:3800::1002
            - name: BIRDLG_TRACEROUTE_BIN
              value: /traceroute
            # -i binds to the VRF, so traceroutes leave through the tunnels
            # from fd69:420:cafe:ffff::1 instead of the LAN
            - name: BIRDLG_TRACEROUTE_FLAGS
              value: -q1 -N32 -w1 -i vrf-dn42
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            # bird.ctl is root:root 0660
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # SO_BINDTODEVICE for traceroute -i
              add: [NET_RAW]
          volumeMounts:
            - name: bird
              mountPath: /var/run/bird
        - name: bird-exporter
          image: ghcr.io/czerwonk/bird_exporter:1.7.1@sha256:694887d59b448ea67e5b1f04ca8978012c94ddeb2527b77f646301ae3f2551ce
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          args:
            - -bird.v2
            - -bird.socket=/var/run/bird/bird.ctl
            - -web.listen-address=[$(HOST_IP)]:9324
          ports:
            - name: bird-metrics
              containerPort: 9324
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: bird
              mountPath: /var/run/bird
        # traffic counters of the tunnels; hostNetwork, as /proc/net/dev shows
        # the reader's own network namespace
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.13.1@sha256:011e2d12c5bff759b90804bda642664775d7b4b127bf5148539bb82d3f590bb7
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          args:
            - --collector.disable-defaults
            - --collector.netdev
            - --collector.netdev.device-include=^(wg-.*|enp1s0)$
            - --web.listen-address=[$(HOST_IP)]:9100
          ports:
            - name: node-metrics
              containerPort: 9100
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        # handshake age and per-peer transfer of the tunnels. The links report
        # operstate unknown, so this is where a dead tunnel shows up.
        - name: wireguard-exporter
          image: mindflavor/prometheus-wireguard-exporter:3.6.6@sha256:3d46c76371f8272ee6d87c5bf9337f444527601e2812ebec7d3e0174cc7ceb6c
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          args:
            # no sudo: it runs as root and calls wg directly
            - -a
            - "false"
            # wireguard_latest_handshake_delay_seconds
            - -d
            - "true"
            - -l
            - $(HOST_IP)
            - -p
            - "9586"
          ports:
            - name: wg-metrics
              containerPort: 9586
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            # wg show reads the devices over netlink, which needs CAP_NET_ADMIN
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]
      volumes:
        # BIRD's socket directory on talos4 (the dn42-bird DaemonSet; was /var/run/bird of the bird2 extension)
        - name: bird
          hostPath:
            path: /var/run/dn42-bird
            type: DirectoryOrCreate
---
# scraped by VictoriaMetrics (argocd-managed/victoria-metrics)
apiVersion: v1
kind: Service
metadata:
  name: metrics
spec:
  ipFamilies: [IPv6]
  selector:
    app: agent
  ports:
    - name: bird
      port: 9324
      targetPort: bird-metrics
    - name: node
      port: 9100
      targetPort: node-metrics
    - name: wireguard
      port: 9586
      targetPort: wg-metrics
