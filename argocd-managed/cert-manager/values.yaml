issuers:
  # Profile defaults to shortlived in templates/issuers.yaml, set `profile:` to
  # override: https://letsencrypt.org/docs/profiles/
  - name: letsencrypt
    cloudflare: true
  - name: letsencrypt-servfail
    servfail: true
  - name: letsencrypt-http01
    http01: true
  # https://letsencrypt.org/docs/staging-environment/
  # - name: letsencrypt-staging
  #   server: https://acme-staging-v02.api.letsencrypt.org/directory
  #   cloudflare: true
  #   account_key: letsencrypt-staging
  # - name: letsencrypt-staging-http01
  #   server: https://acme-staging-v02.api.letsencrypt.org/directory
  #   http01: true
  #   account_key: letsencrypt-staging

# https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml
cert-manager: # set values for wrapper/umbrella chart
  installCRDs: true
  featureGates: ACMEUseARI=true
  enableCertificateOwnerRef: true

# https://github.com/zachomedia/cert-manager-webhook-pdns/blob/main/deploy/cert-manager-webhook-pdns/values.yaml
cert-manager-webhook-pdns:
  # Restricted pod security. The image has no USER (root), the chart already
  # runs it as 100:100; it only reads the mounted serving cert.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsUser: 100
    runAsGroup: 100
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

# https://github.com/oscrx/tlsa-dnsendpoint-controller
tlsa-dnsendpoint-controller: {}
