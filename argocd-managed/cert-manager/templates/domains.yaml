{{- range $domain := .Values.domains }}
{{- $noDotsDomain :=  regexReplaceAll "\\W+" $domain.name "-" | nospace }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $noDotsDomain }}
  {{- if not (eq $domain.tlsa false) }}
  annotations:
    # Publishes a TLSA (DANE) record for the apex via a DNSEndpoint. The
    # wildcard SAN is skipped by the controller, since DANE clients look up the
    # concrete name they connected to. Set `tlsa: false` on a domain to opt out.
    tlsa.oscarr.nl/enabled: "true"
    {{- with $domain.tlsaPorts }}
    tlsa.oscarr.nl/ports: {{ . | quote }}
    {{- end }}
  {{- end }}
spec:
  secretName: {{ $noDotsDomain }}-tls
  issuerRef:
    name: {{ $domain.issuer | default "letsencrypt-shortlived" }}
    kind: Issuer
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
  dnsNames:
    - "{{ $domain.name }}"
    - "*.{{ $domain.name }}"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-tls-{{ $noDotsDomain }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`fake`)
      kind: Rule
      services:
        - name: noop@internal
          kind: TraefikService
  tls:
    secretName: {{ $noDotsDomain }}-tls
    domains:
      - main: "{{ $domain.name }}"
      - sans: ["*.{{ $domain.name }}"]
{{- end }}
