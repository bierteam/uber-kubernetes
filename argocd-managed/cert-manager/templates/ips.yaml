{{- with .Values.ips }}
{{- $first := index . 0 }}
---
# One certificate for all of the cluster's public addresses. Let's Encrypt only
# issues IP certificates on the shortlived profile, validated per address.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ip-addresses
spec:
  secretName: ip-addresses-tls
  issuerRef:
    name: {{ $.Values.ipsIssuer | default "letsencrypt-shortlived-http01" }}
    kind: Issuer
  privateKey:
    rotationPolicy: Always
    algorithm: ECDSA
  ipAddresses:
    {{- range . }}
    - {{ .address | quote }}
    {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-tls-ip-addresses
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`fake`)
      kind: Rule
      services:
        - name: noop@internal
          kind: TraefikService
  tls:
    secretName: ip-addresses-tls
    domains:
      - main: {{ $first.address | quote }}
        {{- with rest . }}
        sans:
          {{- range . }}
          - {{ .address | quote }}
          {{- end }}
        {{- end }}
{{- end }}
