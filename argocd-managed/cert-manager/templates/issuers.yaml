{{- range $issuer := .Values.issuers }}
---
apiVersion: cert-manager.io/v1
kind: {{ $issuer.kind | default "Issuer" }}
metadata:
  name: {{ $issuer.name }}
spec:
  acme:
    server: {{ $issuer.server | default "https://acme-v02.api.letsencrypt.org/directory" }}
    {{- with $issuer.caBundleFile }}
    # the CA the ACME server's own certificate chains to
    caBundle: {{ $.Files.Get . | b64enc }}
    {{- end }}
    email: {{ $issuer.email | default "oscar@oscarr.nl" }}
    privateKeySecretRef:
      name: {{ $issuer.account_key | default "letsencrypt" }}
    {{- /* an empty profile: leaves it out, for CAs without ACME profiles */}}
    {{- with ternary $issuer.profile "shortlived" (hasKey $issuer "profile") }}
    profile: {{ . }}
    {{- end }}
    solvers:
    {{- if $issuer.cloudflare }}
      - dns01:
          cnameStrategy: Follow
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-token-secret
              key: api-token
    {{- else if $issuer.servfail }}
      - dns01:
          cnameStrategy: Follow
          webhook:
            groupName: acme.zacharyseguin.ca
            solverName: pdns
            config:
              host: https://beta.servfail.network
              serverID: ns1.famfo.xyz.
              apiKeySecretRef:
                name: servfail-api-key
                key: key
    {{- else if $issuer.rfc2136 }}
      - dns01:
          rfc2136:
            nameserver: {{ $issuer.rfc2136.nameserver | quote }}
            tsigKeyName: {{ $issuer.rfc2136.tsigKeyName }}
            tsigAlgorithm: HMACSHA256
            tsigSecretSecretRef:
              name: {{ $issuer.rfc2136.secretName }}
              key: secret
        {{- with $issuer.rfc2136.zones }}
        selector:
          dnsZones:
            {{- toYaml . | nindent 12 }}
        {{- end }}
    {{- else if $issuer.http01 }}
      - http01:
          ingress:
            class: traefik
    {{- else if $issuer.http01Gateway }}
      # The parentRef has no namespace, so it resolves to the namespace of each
      # Certificate: every app using this issuer names its Gateway the same.
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: {{ $issuer.http01Gateway }}
    {{- end }}
{{- end }}
