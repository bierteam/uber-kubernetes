# Shared by every cluster. Per-cluster overrides live in values-<cluster>.yaml,
# picked up by the cilium ApplicationSet (applicationSets in argocd-apps/values.yaml).

# Wrapper-chart values, consumed by templates/loadbalancer.yaml and bgp.yaml.
loadBalancer:
  enabled: false
  pool:
    blocks: []
  l2:
    interfaces: []
  bgp:
    enabled: false
    localASN: 64513
    peers: []  # [{name, address, asn}]

# https://github.com/cilium/cilium/blob/main/install/kubernetes/cilium/values.yaml
cilium: # set values for wrapper/umbrella chart
  kubeProxyReplacement: true
  # Restart on cilium-config changes; the operator only registers CRDs for
  # newly enabled features (like BGP) at startup.
  rollOutCiliumPods: true
  operator:
    rollOutPods: true
  k8sClientRateLimit:
    qps: 50
    burst: 100
  ipam:
    mode: kubernetes
