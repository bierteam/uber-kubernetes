# Overrides for the talos-cluster (IPv6-only, KubePrism, Cilium LB-IPAM + L2/BGP).
loadBalancer:
  enabled: true
  pools:
    - name: default-pool
      blocks:
        # inside the LAN /64, reachable through L2 announcements only
        - "2a05:f080:0:3800:1b::/112"
        # routed /64 from the /56, announced to OPNsense over BGP
        - "2a05:f080:0:38ff::/64"
      serviceSelector:
        matchExpressions:
          - key: lb.oscarr.nl/pool
            operator: NotIn
            values: ["dn42"]
    # Opt-in with the label lb.oscarr.nl/pool: dn42. Announced to OPNsense like
    # the rest; bird on talos4 already announces the whole /48 to DN42.
    - name: dn42
      blocks:
        - "fd69:420:cafe:ff::/64"
      serviceSelector:
        matchLabels:
          lb.oscarr.nl/pool: dn42
  l2:
    interfaces:
      - "^en.+"
  bgp:
    enabled: true
    peers:
      # os-frr on OPNsense; it accepts only /128s from the 38ff pool
      - name: opnsense
        address: "2a05:f080:0:3800::a"
        asn: 64512

cilium:
  ipv4:
    enabled: false
  ipv6:
    enabled: true
  k8sServiceHost: localhost
  k8sServicePort: 7445
  # only the LAN NICs, not the dn42 WireGuard links on talos4
  devices: en+
  l2announcements:
    enabled: true
  bgpControlPlane:
    enabled: true
  # Ingress for the talos cluster. Needs the Gateway API CRDs (gateway-api-talos app)
  # present before the operator starts, or it silently skips the controller.
  gatewayAPI:
    enabled: true
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup
