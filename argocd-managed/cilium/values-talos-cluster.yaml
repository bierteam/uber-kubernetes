# Overrides for the talos-cluster (IPv6-only, KubePrism, Cilium LB-IPAM + L2).
loadBalancer:
  enabled: true
  pool:
    blocks:
      - "2a05:f080:0:3800:1b::/112"
  l2:
    interfaces:
      - "^en.+"

cilium:
  ipv4:
    enabled: false
  ipv6:
    enabled: true
  k8sServiceHost: localhost
  k8sServicePort: 7445
  # only the LAN NICs, not the dn42 WireGuard links on talos4
  devices: en+
  l2announcements:
    enabled: true
  # Ingress for the talos cluster. Needs the Gateway API CRDs (gateway-api-talos app)
  # present before the operator starts, or it silently skips the controller.
  gatewayAPI:
    enabled: true
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup
