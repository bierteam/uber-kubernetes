---
# Open WebUI runs on the IPv6-only Talos cluster. IPv6 clients reach its
# Gateway directly; IPv4 clients land here on the firewall's 443 and get their
# TLS passed through, unterminated, to the talos Gateway over IPv6. On port 80
# only ACME HTTP-01 challenges are forwarded, same as matrix.yaml.
kind: Service
apiVersion: v1
metadata:
  name: chat-doktermarjolein-talos
spec:
  clusterIP: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv6
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: chat-doktermarjolein-talos
  labels:
    kubernetes.io/service-name: chat-doktermarjolein-talos
addressType: IPv6
endpoints:
  - addresses:
      - "2a05:f080:0:3800:1b::5"
    # Traefik's TCP (passthrough) service skips endpoints without an explicit
    # ready condition, leaving it with no servers; HTTP routes don't care.
    conditions:
      ready: true
      serving: true
ports:
  - name: http
    port: 80
    protocol: TCP
  - name: https
    port: 443
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: chat-doktermarjolein-talos
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`chat.doktermarjolein.nl`)
      services:
        - name: chat-doktermarjolein-talos
          port: 443
  tls:
    passthrough: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: chat-doktermarjolein-talos-acme
spec:
  entryPoints:
    - web
  routes:
    - match: >-
        Host(`chat.doktermarjolein.nl`) &&
        PathPrefix(`/.well-known/acme-challenge/`)
      kind: Rule
      services:
        - name: chat-doktermarjolein-talos
          port: 80
          passHostHeader: true
