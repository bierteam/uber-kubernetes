---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: ninoo-nl
spec:
  endpoints:
    - dnsName: ninoo.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - kubernetes.oscarr.nl
    - dnsName: "*.ninoo.nl"
      recordTTL: 1
      recordType: CNAME
      targets:
        - kubernetes.oscarr.nl
    - dnsName: ninoo.nl
      recordTTL: 1
      recordType: CAA
      targets:
        - 0 issue letsencrypt.org
        - 0 issuewild letsencrypt.org
        - 0 iodef mailto:caa@oscarr.nl
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: devopscar-nl
spec:
  endpoints:
    - dnsName: devopscar.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - kubernetes.oscarr.nl
    - dnsName: "*.devopscar.nl"
      recordTTL: 1
      recordType: CNAME
      targets:
        - kubernetes.oscarr.nl
    - dnsName: devopscar.nl
      recordTTL: 1
      recordType: CAA
      targets:
        - 0 issue letsencrypt.org
        - 0 issuewild letsencrypt.org
        - 0 iodef mailto:caa@oscarr.nl
    - dnsName: devopscar.nl
      recordTTL: 1
      recordType: TXT
      targets:
        - v=spf1 -all
    - dnsName: _keybase.devopscar.nl
      recordTTL: 1
      recordType: TXT
      targets:
        - keybase-site-verification=IkBr0bljo6ldzMAmo1qRacy1frBihmnGYJ0J8slDKRw
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: oscarr-nl
spec:
  endpoints:
    - dnsName: oscarr.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - kubernetes.oscarr.nl
    - dnsName: oscarr.nl
      recordTTL: 1
      recordType: CAA
      targets:
        - 0 issue letsencrypt.org
        - 0 issuewild letsencrypt.org
        - 0 iodef mailto:caa@oscarr.nl
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: doktermarjolein-nl
spec:
  endpoints:
    - dnsName: doktermarjolein.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - kubernetes.oscarr.nl

    - dnsName: doktermarjolein.nl
      recordTTL: 1
      recordType: CAA
      targets:
        - 0 issue letsencrypt.org
        - 0 issuewild letsencrypt.org
        - 0 iodef mailto:caa@oscarr.nl

    # Minecraft on the Talos cluster. AAAA is the Cilium LoadBalancer that
    # Velocity holds, so IPv6 clients reach the proxy directly. A is the public
    # v4 of the firewall, where HAProxy fronts the same proxy -- the cluster is
    # IPv6-only and has no v4 address of its own.
    - dnsName: mc.doktermarjolein.nl
      recordTTL: 1
      recordType: A
      targets:
        - 185.132.110.37

    - dnsName: mc.doktermarjolein.nl
      recordTTL: 1
      recordType: AAAA
      targets:
        - 2a05:f080:0:3800:1b::1

    - dnsName: _minecraft._tcp.mc.doktermarjolein.nl
      recordTTL: 1
      recordType: SRV
      targets:
        - 0 5 25580 mc.doktermarjolein.nl.

    - dnsName: survival.doktermarjolein.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - mc.doktermarjolein.nl

    - dnsName: _minecraft._tcp.survival.doktermarjolein.nl
      recordTTL: 1
      recordType: SRV
      targets:
        - 0 5 25580 survival.doktermarjolein.nl.

    - dnsName: backup.doktermarjolein.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - mc.doktermarjolein.nl

    - dnsName: _minecraft._tcp.backup.doktermarjolein.nl
      recordTTL: 1
      recordType: SRV
      targets:
        - 0 5 25580 backup.doktermarjolein.nl.

    - dnsName: skyblock.doktermarjolein.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - mc.doktermarjolein.nl

    - dnsName: _minecraft._tcp.skyblock.doktermarjolein.nl
      recordTTL: 1
      recordType: SRV
      targets:
        - 0 5 25580 skyblock.doktermarjolein.nl.

    - dnsName: vanilla.doktermarjolein.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - mc.doktermarjolein.nl

    - dnsName: _minecraft._tcp.vanilla.doktermarjolein.nl
      recordTTL: 1
      recordType: SRV
      targets:
        - 0 0 25580 vanilla.doktermarjolein.nl.

    - dnsName: minecraft.doktermarjolein.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - mc.doktermarjolein.nl

    - dnsName: _minecraft._tcp.minecraft.doktermarjolein.nl
      recordTTL: 1
      recordType: SRV
      targets:
        - 0 0 25580 minecraft.doktermarjolein.nl.
