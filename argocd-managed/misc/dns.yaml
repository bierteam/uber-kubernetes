---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: ninoo-nl
spec:
  endpoints:
    - dnsName: ninoo.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - kubernetes.oscarr.nl
    - dnsName: "*.ninoo.nl"
      recordTTL: 1
      recordType: CNAME
      targets:
        - kubernetes.oscarr.nl
    # CAA records are set by hand in Cloudflare and only written down here:
    # the DNSEndpoint CRD has no CAA record type, and the ownership TXT of an
    # apex record (owned-by-caa-<zone>) would fall outside the zone anyway.
    # Keep these comments in step with Cloudflare. Only unds issues here (dns-01).
    #   ninoo.nl CAA 0 issue "letsencrypt.org;validationmethods=dns-01;accounturi=https://acme-v02.api.letsencrypt.org/acme/acct/2048836347"
    #   ninoo.nl CAA 0 issuewild "letsencrypt.org;validationmethods=dns-01;accounturi=https://acme-v02.api.letsencrypt.org/acme/acct/2048836347"
    #   ninoo.nl CAA 0 issuemail ";"
    #   ninoo.nl CAA 0 iodef "mailto:caa@oscarr.nl"
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: oscarr-nl
spec:
  endpoints:
    - dnsName: oscarr.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - kubernetes.oscarr.nl
    # CAA, set by hand in Cloudflare (see ninoo.nl). Only the Let's Encrypt
    # accounts of cert-manager on unds (all its Issuers share the `letsencrypt`
    # key, dns-01) and talos-cluster (HTTP-01, e.g. lg.dn42.oscarr.nl), with
    # any validation method:
    #   oscarr.nl CAA 0 issue "letsencrypt.org;accounturi=https://acme-v02.api.letsencrypt.org/acme/acct/2048836347"
    #   oscarr.nl CAA 0 issue "letsencrypt.org;accounturi=https://acme-v02.api.letsencrypt.org/acme/acct/3818123626"
    #   oscarr.nl CAA 0 issuewild "letsencrypt.org;accounturi=https://acme-v02.api.letsencrypt.org/acme/acct/2048836347"
    #   oscarr.nl CAA 0 issuewild "letsencrypt.org;accounturi=https://acme-v02.api.letsencrypt.org/acme/acct/3818123626"
    #   oscarr.nl CAA 0 issuemail ";"
    #   oscarr.nl CAA 0 iodef "mailto:caa@oscarr.nl"
    # headscale gets its own certificate (its built-in ACME client, tls-alpn-01):
    #   headscale.oscarr.nl CAA 0 issue "letsencrypt.org;validationmethods=tls-alpn-01;accounturi=https://acme-v02.api.letsencrypt.org/acme/acct/3788433866"
    # DN42 WireGuard endpoint on talos4, for peers that only accept a hostname
    - dnsName: nl-hou01.dn42.oscarr.nl
      recordTTL: 1
      recordType: AAAA
      targets:
        - 2a05:f080:0:3800::1019
    # DN42 looking glass, the Gateway in the dn42-lg app (IPv6 only)
    - dnsName: lg.dn42.oscarr.nl
      recordTTL: 1
      recordType: AAAA
      targets:
        - 2a05:f080:0:3800:1b::7
    # DN42 peering page, the Gateway in the dn42-homepage app (IPv6 only)
    - dnsName: dn42.oscarr.nl
      recordTTL: 1
      recordType: AAAA
      targets:
        - 2a05:f080:0:3800:1b::8
    # DN42 autopeering, the Gateway in the dn42-autopeer app (IPv6 only)
    - dnsName: autopeer.dn42.oscarr.nl
      recordTTL: 1
      recordType: AAAA
      targets:
        - 2a05:f080:0:3800:1b::9
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: doktermarjolein-nl
spec:
  endpoints:
    - dnsName: doktermarjolein.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - kubernetes.oscarr.nl

    # CAA, set by hand in Cloudflare (see ninoo.nl). Only unds issues here:
    #   doktermarjolein.nl CAA 0 issue "letsencrypt.org;validationmethods=dns-01;accounturi=https://acme-v02.api.letsencrypt.org/acme/acct/2048836347"
    #   doktermarjolein.nl CAA 0 issuewild "letsencrypt.org;validationmethods=dns-01;accounturi=https://acme-v02.api.letsencrypt.org/acme/acct/2048836347"
    #   doktermarjolein.nl CAA 0 issuemail ";"
    #   doktermarjolein.nl CAA 0 iodef "mailto:caa@oscarr.nl"
    # and for the open-webui Certificate on talos-cluster (HTTP-01):
    #   chat.doktermarjolein.nl CAA 0 issue "letsencrypt.org;validationmethods=http-01"

    # Open WebUI on the Talos cluster. AAAA is its Cilium Gateway, A is the
    # firewall's public v4, passed through by Traefik (see chat-doktermarjolein.yaml).
    - dnsName: chat.doktermarjolein.nl
      recordTTL: 1
      recordType: A
      targets:
        - 185.132.110.37
    - dnsName: chat.doktermarjolein.nl
      recordTTL: 1
      recordType: AAAA
      targets:
        - 2a05:f080:0:3800:1b::5

    # Minecraft on the Talos cluster. AAAA is the Cilium LoadBalancer that
    # Velocity holds, so IPv6 clients reach the proxy directly. A is the public
    # v4 of the firewall, where HAProxy fronts the same proxy -- the cluster is
    # IPv6-only and has no v4 address of its own.
    - dnsName: mc.doktermarjolein.nl
      recordTTL: 1
      recordType: A
      targets:
        - 185.132.110.37

    - dnsName: mc.doktermarjolein.nl
      recordTTL: 1
      recordType: AAAA
      targets:
        - 2a05:f080:0:3800:1b::1

    - dnsName: _minecraft._tcp.mc.doktermarjolein.nl
      recordTTL: 1
      recordType: SRV
      targets:
        - 0 5 25580 mc.doktermarjolein.nl.

    - dnsName: survival.doktermarjolein.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - mc.doktermarjolein.nl

    - dnsName: _minecraft._tcp.survival.doktermarjolein.nl
      recordTTL: 1
      recordType: SRV
      targets:
        - 0 5 25580 survival.doktermarjolein.nl.

    - dnsName: backup.doktermarjolein.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - mc.doktermarjolein.nl

    - dnsName: _minecraft._tcp.backup.doktermarjolein.nl
      recordTTL: 1
      recordType: SRV
      targets:
        - 0 5 25580 backup.doktermarjolein.nl.

    - dnsName: skyblock.doktermarjolein.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - mc.doktermarjolein.nl

    - dnsName: _minecraft._tcp.skyblock.doktermarjolein.nl
      recordTTL: 1
      recordType: SRV
      targets:
        - 0 5 25580 skyblock.doktermarjolein.nl.

    - dnsName: vanilla.doktermarjolein.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - mc.doktermarjolein.nl

    - dnsName: _minecraft._tcp.vanilla.doktermarjolein.nl
      recordTTL: 1
      recordType: SRV
      targets:
        - 0 0 25580 vanilla.doktermarjolein.nl.

    - dnsName: minecraft.doktermarjolein.nl
      recordTTL: 1
      recordType: CNAME
      targets:
        - mc.doktermarjolein.nl

    - dnsName: _minecraft._tcp.minecraft.doktermarjolein.nl
      recordTTL: 1
      recordType: SRV
      targets:
        - 0 0 25580 minecraft.doktermarjolein.nl.
