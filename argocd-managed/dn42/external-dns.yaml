# Publishes oscrx.dn42 names for talos-cluster Services and HTTPRoutes into
# knot over RFC2136, from the external-dns.kubernetes.io/hostname annotation
# (v0.23 dropped the alpha prefix). Separate from the external-dns app, which
# runs on the other cluster and writes to Cloudflare.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns-dn42
rules:
  - apiGroups: [""]
    resources: [services, pods, nodes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns-dn42
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns-dn42
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: dn42
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.23.0@sha256:1854499e2b08cee47c40a08e356bff20dcb192dbcfde8378fc3f900f12cad5a3
          args:
            - --source=service
            - --source=gateway-httproute
            - --domain-filter=oscrx.dn42
            - --provider=rfc2136
            # knot-update
            - --rfc2136-host=fd26:4340:84fe::53
            - --rfc2136-port=53
            - --rfc2136-zone=oscrx.dn42
            - --rfc2136-tsig-keyname=external-dns
            - --rfc2136-tsig-secret-alg=hmac-sha256
            - --rfc2136-axfr
            # it writes TTL 0 otherwise
            - --rfc2136-min-ttl=5m
            - --registry=txt
            - --txt-owner-id=talos-cluster
            - --txt-prefix=owned-by-
            - --policy=sync
            - --interval=1m
          env:
            - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
              valueFrom:
                secretKeyRef:
                  name: knot-tsig
                  key: external-dns
          ports:
            - name: http
              containerPort: 7979
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
