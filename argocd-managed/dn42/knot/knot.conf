# Authoritative DNS for oscrx.dn42 and its reverse zone, as ns1 and ns2.
# Each zone is signed with one key (a CSK) from the knot-keys Secret, imported
# into the empty /storage at start. Keys never roll: the DS in the DN42
# registry is pinned to them.
# external-dns and cert-manager update oscrx.dn42 with TSIG keys from
# knot-tsig. Updates only live in the journal: after a restart external-dns
# writes them again.
server:
  rundir: /rundir
  # the pod runs as non-root, the Services map 53 to 5353
  listen: [ "::@5353" ]
  identity: ""
  version: ""
  nsid: ""

# the external-dns and cert-manager keys
include: /tsig/tsig.conf

log:
  - target: stdout
    any: info

database:
  storage: /storage

acl:
  # external-dns reads the zone before changing it
  - id: external-dns-transfer
    key: external-dns
    action: transfer
  - id: external-dns
    key: external-dns
    action: update
  - id: cert-manager
    key: cert-manager
    action: update
    update-type: [TXT]
    update-owner: name
    update-owner-match: pattern
    update-owner-name: [_acme-challenge, _acme-challenge.*]

mod-rrl:
  - id: default
    rate-limit: 200
    slip: 2

# Addresses in the /48 without a static PTR get one under dynamic.oscrx.dn42,
# e.g. fd69-420-cafe-12-abcd--1234.dynamic.oscrx.dn42, which resolves back.
mod-synthrecord:
  - id: forward
    type: forward
    prefix: ""
    ttl: 3600
    network: fd69:420:cafe::/48
  - id: reverse
    type: reverse
    prefix: ""
    origin: dynamic.oscrx.dn42
    ttl: 3600
    network: fd69:420:cafe::/48

# zone signing doesn't cover synthesized records, so those zones are signed
# per answer instead, after synthrecord
mod-onlinesign:
  - id: default
    policy: default

policy:
  - id: default
    manual: on
    single-type-signing: on
    algorithm: ecdsap256sha256
    nsec3: off

template:
  - id: default
    file: /zones/%s.zone
    # the zone files are a read-only ConfigMap: keep the signed zone in the
    # journal and bump the serial ourselves
    zonefile-sync: -1
    zonefile-load: difference-no-serial
    journal-content: all
    serial-policy: unixtime
    dnssec-signing: on
    dnssec-policy: default
    semantic-checks: on
    global-module: mod-rrl/default

zone:
  - domain: oscrx.dn42
    acl: [external-dns-transfer, external-dns, cert-manager]
  - domain: dynamic.oscrx.dn42
    dnssec-signing: off
    module: [mod-synthrecord/forward, mod-onlinesign/default]
  - domain: e.f.a.c.0.2.4.0.9.6.d.f.ip6.arpa
    dnssec-signing: off
    module: [mod-synthrecord/reverse, mod-onlinesign/default]
