# One CSK per zone for knot, sealed for talos-cluster. The DS records in the
# DN42 registry and in oscrx.dn42.zone are pinned to these keys: regenerating
# them means updating both.
# Generated in a throwaway knot container (keymgr -D /tmp/g <zone> generate
# algorithm=13 ksk=yes zsk=yes) and piped straight into
# kubeseal --context talos-cluster --controller-namespace kube-system --controller-name sealed-secrets-talos-cluster
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: knot-keys
  namespace: dn42
spec:
  encryptedData:
    dynamic.oscrx.dn42.pem: 
    e.f.a.c.0.2.4.0.9.6.d.f.ip6.arpa.pem: 
    oscrx.dn42.pem: 
  template:
    metadata:
      name: knot-keys
      namespace: dn42
