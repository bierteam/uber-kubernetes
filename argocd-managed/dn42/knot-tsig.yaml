# TSIG keys for updates to oscrx.dn42, sealed for talos-cluster: tsig.conf is
# included by knot.conf, external-dns is the same external-dns secret for the
# external-dns pod. The cert-manager key's secret is also sealed as dn42-tsig
# in the cert-manager app. Generated in memory with
# head -c 32 /dev/urandom | base64 and piped straight into
# kubeseal --context talos-cluster --controller-namespace kube-system --controller-name sealed-secrets-talos-cluster
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: knot-tsig
  namespace: dn42
spec:
  encryptedData:
    external-dns: 
    tsig.conf: 
  template:
    metadata:
      name: knot-tsig
      namespace: dn42
