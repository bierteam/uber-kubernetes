# https://github.com/otwld/ollama-helm
ollama: # set values for wrapper/umbrella chart
  # Requesting the GPU (plus the chart's matching toleration) is what lands this
  # on talos5, the RTX 3080 game PC. That node is offline while it is booted into
  # Windows/Bazzite, so the pod sits Pending until it comes back. No
  # runtimeClassName: the gpu-operator injects the GPU through CDI.
  ollama:
    gpu:
      enabled: true
      type: nvidia
      number: 1
  # Replaces the chart's model hook (ollama.models.*), adding a GPU check.
  # After talos5 boots, the scheduler can start this pod before the gpu-operator
  # has its toolkit/CDI injection running; the container then comes up without
  # /dev/nvidia0 or libcuda and Ollama silently falls back to CPU. Failing the
  # hook makes the kubelet recreate the container until the GPU is injected.
  #
  # Three variants, each with the largest context that still fits fully in the
  # 3080's 10 GB (measured with `ollama ps`). Clients pick one by name; only one
  # is in VRAM at a time and swapping takes a few seconds.
  #   coder  qwen2.5-coder:7b   32k (its trained maximum)  5.7 GB  ~128 tok/s
  #   long   qwen3:4b-instruct  64k                        8.0 GB  ~178 tok/s
  #   huge   granite4:tiny-h    256k (hybrid Mamba, cheap)  6.3 GB  ~230 tok/s
  lifecycle:
    postStart:
      exec:
        command:
          - /bin/sh
          - -c
          - |
            [ -e /dev/nvidia0 ] && ldconfig -p | grep -q libcuda.so.1 || exit 1
            while ! /bin/ollama ps > /dev/null 2>&1; do
              sleep 5
            done
            variant() { # name base num_ctx
              /bin/ollama pull "$2" || exit 1
              printf 'FROM %s\nPARAMETER num_ctx %s\n' "$2" "$3" > "/tmp/$1.Modelfile"
              /bin/ollama create "$1" -f "/tmp/$1.Modelfile" || exit 1
            }
            variant coder qwen2.5-coder:7b 32768
            variant long qwen3:4b-instruct 65536
            variant huge granite4:tiny-h 262144
            # load the default one; OLLAMA_KEEP_ALIVE keeps it in VRAM
            /bin/ollama run coder "" > /dev/null
  extraEnv:
    - name: OLLAMA_KEEP_ALIVE
      value: "-1"
    # the variants do not fit in VRAM next to each other
    - name: OLLAMA_MAX_LOADED_MODELS
      value: "1"
    # fallback for models without their own num_ctx
    - name: OLLAMA_CONTEXT_LENGTH
      value: "32768"
    # single user; every parallel slot reserves its own full-length KV cache
    - name: OLLAMA_NUM_PARALLEL
      value: "1"
    - name: OLLAMA_FLASH_ATTENTION
      value: "1"
    # halves KV cache memory with no noticeable quality loss
    - name: OLLAMA_KV_CACHE_TYPE
      value: q8_0
  persistentVolume:
    enabled: true
    size: 40Gi
    # talos5's local user volume: a cold model load from NFS took ~70s. The volume
    # is pinned to talos5, which is the only node this can run on anyway.
    storageClass: local-path
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      memory: 12Gi
  # helm test pod; ArgoCD would keep it around as a stray resource
  tests:
    enabled: false
