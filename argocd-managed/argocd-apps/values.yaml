---
argocdApps:
  # - name: agones
  #   server: talos-cluster
  #   podSecurity: baseline
  - name: cilium
    docs: https://cilium.io/
    namespace: kube-system
    podSecurity: privileged
    server: talos-cluster
    finalizer: false # moving to the cilium ApplicationSet; a prune must not take the CNI with it
  - name: cyberchef
    docs: https://github.com/gchq/CyberChef
  - name: dex
    docs: https://dexidp.io/
  - name: dn42
    docs: https://github.com/bgp/stayrtr
    server: talos-cluster
  # - name: dns-updater
  #   podSecurity: restricted
  - name: drinkn
    docs: https://github.com/bierteam/drinkn
    folder: charts/pils
    repository: drinkn
  - name: drinkn-hooks
  - name: external-dns
    docs: https://github.com/kubernetes-sigs/external-dns
  # - name: external-secrets
  - name: factorio
    docs: https://github.com/SQLJames/factorio-server-charts
  - name: friend-tracker
  - name: gim-tracker
  - name: gpu-operator
    docs: https://github.com/NVIDIA/gpu-operator
    podSecurity: privileged # driver validation, toolkit and device plugin need host access
    server: talos-cluster
  - name: kubelet-csr-approver
    docs: https://github.com/postfinance/kubelet-csr-approver
    server: talos-cluster
  - name: kubeseal-webgui
    docs: https://github.com/jaydee94/kubeseal-webgui
  - name: local-path-provisioner
    docs: https://github.com/rancher/local-path-provisioner
    podSecurity: privileged # helper pods create volume directories through hostPath
    server: talos-cluster
  # - name: longhorn
  #   namespace: longhorn-system
  #   podSecurity: privileged
  # - name: metrics-server
  - name: minecraft
    docs: https://github.com/itzg/minecraft-server-charts
    server: talos-cluster
  - name: misc
  - name: nfs-csi
    docs: https://github.com/kubernetes-csi/csi-driver-nfs
    namespace: kube-system
    podSecurity: privileged # node plugin mounts hostPath and runs privileged
    server: talos-cluster
  - name: ollama
    docs: https://github.com/otwld/ollama-helm
    podSecurity: baseline # upstream image runs as root
    server: talos-cluster
  - name: open-webui
    docs: https://docs.openwebui.com/
    server: talos-cluster
  - name: rick
  - name: sealed-secrets
    docs: https://github.com/bitnami-labs/sealed-secrets
    namespace: kube-system
    podSecurity: privileged
  # - name: shulker
  #   server: talos-cluster
  - name: talos5-power
    podSecurity: privileged # hostNetwork for wake-on-lan and Bazzite's link-local address
    server: talos-cluster
  - name: traefik
    docs: https://github.com/traefik/traefik
  - name: unifi
    docs: https://github.com/linuxserver/docker-unifi-network-application
    podSecurity: baseline # TODO verify if this can be restricted
  - name: oscarr
  - name: proxy-oscarr
    docs: https://github.com/oauth2-proxy/oauth2-proxy
    folder: argocd-managed/oauth2-proxy
    valuesFile: values-oscarr.yaml
  - name: proxy-bruinsma
    docs: https://github.com/oauth2-proxy/oauth2-proxy
    folder: argocd-managed/oauth2-proxy
    valuesFile: values-bruinsma.yaml
  # - name: valheim
  # - name: velero
  #   podSecurity: privileged
  - name: vikunja
    docs: https://vikunja.io/
  - name: wildlife-api
    folder: charts
    repository: wildlife-api
  - name: wildlife-frontend
    folder: charts
    repository: wildlife-frontend
  - name: wildlife-database

# Rendered by templates/applicationset-template.yaml. Deployed to every cluster
# whose ArgoCD cluster secret has the label `apps.oscarr.nl/<name>: "true"`, with
# `values-<cluster>.yaml` from the app folder layered on top when it exists.
# primaryCluster: the app on that cluster is named <name>, elsewhere <name>-<cluster>.
applicationSets:
  - name: cert-manager
    docs: https://cert-manager.io/
    primaryCluster: in-cluster
  - name: gateway-api
    docs: https://github.com/kubernetes-sigs/gateway-api
    namespace: default
    primaryCluster: in-cluster
    helm: false # kustomization of the upstream CRDs
  - name: cnpg
    docs: https://cloudnative-pg.io/
    namespace: cnpg-system
    primaryCluster: in-cluster
  - name: security-txt
    docs: https://kubernetes.io/docs/reference/access-authn-authz/mutating-admission-policy/
    namespace: default
    helm: false # plain manifests, a cluster-scoped MutatingAdmissionPolicy
