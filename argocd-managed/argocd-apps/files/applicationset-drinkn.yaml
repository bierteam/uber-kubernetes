---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: drinkn
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=invalid']
  generators:
    - pullRequest:
        github:
          owner: bierteam
          repo: drinkn
          tokenRef:
            secretName: github-token
            key: token # prevent rate limiting
          labels:
            - preview
        requeueAfterSeconds: 1800
  template: # https://argo-cd.readthedocs.io/en/release-2.7/operator-manual/applicationset/Generators-Pull-Request/#template
    metadata:
      name: 'drinkn-pr-{{ .number }}'
      labels:
        app.kubernetes.io/instance: drinkn
      annotations:
        link.argocd.argoproj.io/external-link: 'https://github.com/bierteam/drinkn/pull/{{ .number }}'
    spec:
      destination:
        namespace: 'drinkn-pr-{{ .number }}'
        name: 'in-cluster'
      project: restricted
      source:
        repoURL: 'https://github.com/bierteam/drinkn.git'
        targetRevision: '{{ .branch }}'
        path: charts/drinkn
        helm:
          parameters:
            - name: image.tag
              value: 'sha-{{ .head_short_sha_7 }}'
            - name: fqdn
              value: 'drinkn-pr-{{ .number }}.lab.oscarr.nl'
            - name: pr.enabled
              value: 'true'
            - name: pr.number
              value: '{{ .number }}'
            - name: pr.ref
              value: '{{ .branch }}'
            - name: replicas
              value: '1'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/enforce: baseline
          #   argocd.argoproj.io/instance: my-argocd-application-name
          # annotations:
          #   argocd.argoproj.io/tracking-id: >-
          #     drinkn-pr-{{ .number }}:app/Namespace:drinkn-pr-{{ .number }}/drinkn-pr-{{ .number }}
        syncOptions:
          - CreateNamespace=true
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: github-token
  namespace: argocd
  annotations:
    a8r.io/description: "Expires on Thu, Aug 5 2027. https://github.com/settings/tokens?type=beta"
spec:
  encryptedData:
    token: 
