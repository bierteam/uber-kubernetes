{{- $provider := index .Values "external-dns" "provider" "name" }}
{{- if eq $provider "cloudflare" }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare
  namespace: external-dns
spec:
  encryptedData: 
    token: 
{{- end }}
{{- if eq $provider "rfc2136" }}
---
# TSIG key for updates to knot in the dn42 app, the same external-dns secret as
# in its knot-tsig. Sealed for talos-cluster from that secret, piped straight into
# kubeseal --context talos-cluster --controller-namespace kube-system --controller-name sealed-secrets-talos-cluster
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rfc2136-tsig
  namespace: external-dns
spec:
  encryptedData:
    secret: 
{{- end }}
