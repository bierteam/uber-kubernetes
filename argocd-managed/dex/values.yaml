# https://github.com/dexidp/helm-charts/blob/master/charts/dex/values.yaml
dex: # set values for wrapper/umbrella chart
  replicaCount: 2

  # Restricted pod security. The image's USER is the name `dex` (1001), so the
  # uid is set explicitly for runAsNonRoot. docker-entrypoint renders the
  # config to /tmp, hence the emptyDir with a read-only root filesystem.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  volumes:
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: tmp
      mountPath: /tmp

  envFrom:
    - secretRef:
        name: dex-secrets

  config:
    issuer: https://auth.oscarr.nl
    storage:
      type: kubernetes
      config:
        inCluster: true

    oauth2:
      skipApprovalScreen: true

    connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: $GITHUB_CLIENT_ID
          clientSecret: $GITHUB_CLIENT_SECRET
          redirectURI: https://auth.oscarr.nl/callback
          orgs:
            - name: bierteam

    staticClients:
      - id: proxmox
        name: Proxmox
        secretEnv: PROXMOX_CLIENT_SECRET
        redirectURIs:
          - "https://proxmox.oscarr.nl:8006"
          - "https://proxmox.oscarr.nl"

          - "https://pve02.oscarr.nl:8006"
          - "https://pve02.oscarr.nl"

          - "https://pve03.oscarr.nl:8006"
          - "https://pve03.oscarr.nl"

          - "https://pve05.oscarr.nl:8006"
          - "https://pve05.oscarr.nl"

      - id: kubernetes
        name: Kubernetes
        public: true

      - id: argocd
        name: ArgoCD
        public: true # PKCE, no client secret
        redirectURIs:
          - https://argocd.lab.oscarr.nl/auth/callback

      - id: argocd-cli
        name: ArgoCD CLI
        public: true
        redirectURIs:
          - http://localhost:8085/auth/callback

      - id: pils
        name: Pils
        public: true
        redirectURIs:
          - https://pils.oscarr.nl/api/v1/users/login/oidc/callback

      - id: hass
        name: Home Assistant
        public: true
        redirectURIs:
          - https://hass.lab.oscarr.nl/auth/oidc/callback

      - id: headscale
        name: Headscale
        secretEnv: HEADSCALE_CLIENT_SECRET
        redirectURIs:
          - https://headscale.oscarr.nl:443/oidc/callback

      - id: proxy-oscarr
        name: Oauth2 Proxy oscarr.nl
        secretEnv: PROXY_OSCARR_CLIENT_SECRET
        redirectURIs:
          - https://proxy.lab.oscarr.nl/oauth2/callback

      - id: proxy-bruinsma
        name: Oauth2 Proxy bruinsma.it
        secretEnv: PROXY_BRUINSMA_CLIENT_SECRET
        redirectURIs:
          - https://login.bruinsma.it/oauth2/callback

      - id: omni
        name: Omni
        secretEnv: OMNI_CLIENT_SECRET
        redirectURIs:
          - https://omni.lab.oscarr.nl/oidc/consume

      - id: vikunja
        name: Vikunja
        secretEnv: VIKUNJA_CLIENT_SECRET
        redirectURIs:
          - https://vikunja.doktermarjolein.nl/auth/openid/dex
