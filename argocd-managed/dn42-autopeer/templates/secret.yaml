# Secrets of the autopeer app, mounted at /secrets. Sealed for talos-cluster
# (scope strict: this name and namespace only).
#   cookie-key            32 random bytes (base64) for the session cookies; generated
#                         and sealed directly, never printed
#   github-app.pem        the GitHub App's private key        (TODO(you))
#   iedon-client-secret   OAuth.dn42 client secret            (TODO(you))
# Add one: kubectl create secret generic dn42-autopeer -n dn42-autopeer --dry-run=client
#   --from-file=<key>=<file> -o json | kubeseal --context talos-cluster
#   --controller-namespace kube-system --controller-name sealed-secrets-talos-cluster
#   --scope strict --merge-into <this file>   (it writes JSON back; keep the file YAML)
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dn42-autopeer
  namespace: dn42-autopeer
spec:
  encryptedData:
    cookie-key: 
  template:
    metadata:
      name: dn42-autopeer
      namespace: dn42-autopeer
    type: Opaque
