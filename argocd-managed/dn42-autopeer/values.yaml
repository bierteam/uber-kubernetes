# autopeer.dn42.oscarr.nl (and autopeer.oscrx.dn42 inside DN42). Changes go
# out as PRs in github.com/oscrx/dn42-peers through the GitHub App; the app
# only reads DN42Peer objects in dn42-router, for its status page.
# Secrets (SealedSecret dn42-autopeer, templates/secret.yaml): cookie-key,
# github-app.pem, iedon-client-secret.
# No registry: both providers return the ASN in their "dn42" claim, so there
# is no mntner -> ASN lookup and no registry clone (git-sync stays off). The
# peers repo's check still validates every PR against the live registry.
dn42-autopeer:
  peersNamespace: dn42-router
  config:
    listen: ":8080"
    publicURL: https://autopeer.dn42.oscarr.nl
    extraPublicURLs:
      - https://autopeer.oscrx.dn42
    cookieKeyFile: /secrets/cookie-key
    sessionTTL: 1h
    limits:
      perLoginPerHour: 3
      totalPerHour: 20
    # Logins showing AS4242423818 are admins: add, edit and remove peerings
    # for any DN42 ASN, auto-merged like any autopeer PR. Anyone who can get
    # either provider to vouch for AS4242423818 gets this, including that
    # provider's operators.
    admin:
      enabled: true
      providers: [iedon, kioubit]
    router:
      asn: 4242423818
      name: oscrx
      # The endpoint on the peering page; port = 2 + the last 4 digits of the ASN.
      endpointHost: nl-hou01.dn42.oscarr.nl
      # Shared key of self-service peers ("autopeer" in dn42-wireguard-keys).
      publicKey: oscrxfobHgtewi+xMJQPNNSEpbBi4XilU7upqJ6Xi2w=
      linkLocal: fe80::3818
    github:
      owner: oscrx
      repo: dn42-peers
      baseBranch: main
      peersDir: peers
      appID: 5903223
      installationID: 185362615
      appLogin: dn42-autopeer[bot] # must match APP_LOGIN in dn42-peers' check.yaml
      privateKeyFile: /secrets/github-app.pem
    kubernetes:
      enabled: true
      namespace: dn42-router
    providers:
      # OAuth.dn42 / Auth42 by iEdon (AS4242422189), discovery verified
      # 2026-11-24: PKCE S256, client_secret_basic/post, scope dn42 adds the
      # "dn42" claim (asn: number, active_mnt, mnt_by) to the ID token and
      # userinfo. Callbacks must be https on auth.iedon.net.
      - name: iedon
        displayName: OAuth.dn42 (iEdon)
        # Its favicon (auth.iedon.net), 64px PNG.
        icon: data:image/png;base64,
        issuer: https://auth.iedon.net
        clientID: 4436e3858c783da025d0b24a6d625414
        clientSecretFile: /secrets/iedon-client-secret
        scopes: [openid, dn42]
        # Logins on autopeer.oscrx.dn42 stay inside DN42: the same service at
        # oauth.dn42 (own issuer, same client), with a DN42 CA certificate
        # (extraCACerts below).
        hostIssuers:
          autopeer.oscrx.dn42: https://oauth.dn42
        claims:
          subject: sub
          # sub is an opaque hash; show the mntner instead.
          name: dn42.active_mnt
          asn: dn42.asn
      # Kioubit (AS4242423914), discovery verified 2026-11-24: issuer
      # dn42.g-load.eu, PKCE S256, public client (no secret), scope dn42 adds a
      # "dn42" claim. Its field names are unverified until a real login.
      - name: kioubit
        displayName: Kioubit.dn42
        # The logo from Kioubit's official auth button.
        icon: data:image/svg+xml;base64,
        issuer: https://dn42.g-load.eu
        clientID: 1531bae9-92cf-44a0-bd04-6f7563b83460
        scopes: [openid, dn42]
        claims:
          subject: sub
          name: dn42.effective_mnt
          asn: dn42.asn
      # HExpNetwork WebAuth (AS4242420298), docs at
      # https://auth42.hexpnet.work/doc.html, discovery checked 2026-11-24:
      # the same Auth42 software as OAuth.dn42 (pairwise sub, dn42 claim with
      # asn and active_mnt). Registered as a public client: PKCE only, no
      # secret (it shows one anyway; unused).
      - name: hexp
        displayName: HExpNetwork WebAuth
        issuer: https://auth42.hexpnet.work
        clientID: NO7LGErf6H2vfNcI
        scopes: [openid, dn42]
        claims:
          subject: sub
          name: dn42.active_mnt
          asn: dn42.asn
  # DN42 root CA, for oauth.dn42. Name-constrained to .dn42
  # and the DN42 ranges. From https://ca.dn42.us/crt/root-ca.crt, sha256
  # 7C:16:2C:DA:B7:CB:97:E9:8C:60:C0:04:EB:36:D7:4E:7B:EC:0D:7F:EB:20:AB:59:BC:9E:99:65:8B:62:D3:E7
