---
# Chat frontend for the Ollama in the ollama namespace. Open WebUI itself needs
# no GPU, so it stays up on any node while talos5 is booted into another OS;
# chats just fail until Ollama is back.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
spec:
  replicas: 1
  # SQLite on a RWO volume: never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.12.5
          env:
            # IPv6-only cluster; the default 0.0.0.0 is unreachable from the gateway.
            - name: HOST
              value: "::"
            - name: WEBUI_URL
              value: https://chat.doktermarjolein.nl
            - name: WEBUI_NAME
              value: Dokter Marjolein
            - name: DEFAULT_LOCALE
              value: nl-NL
            # start.sh generates the key into this file on first boot; on the
            # volume it survives restarts, so logins do too.
            - name: WEBUI_SECRET_KEY_FILE
              value: /app/backend/data/.webui_secret_key
            - name: OLLAMA_BASE_URL
              value: http://ollama.ollama.svc.cluster.local:11434
            - name: ENABLE_OPENAI_API
              value: "false"
            # The general-purpose variant from ollama/values.yaml.
            - name: DEFAULT_MODELS
              value: long
            # The first account becomes admin; everyone after that waits for
            # the admin to approve them.
            - name: ENABLE_SIGNUP
              value: "true"
            - name: DEFAULT_USER_ROLE
              value: pending
            - name: ANONYMIZED_TELEMETRY
              value: "false"
            - name: SCARF_NO_ANALYTICS
              value: "true"
            - name: DO_NOT_TRACK
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
          # First boot runs the DB migrations and downloads the RAG embedding model.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui
spec:
  # nfs-retain (the default class): chat history survives losing a node or the PVC.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: open-webui
