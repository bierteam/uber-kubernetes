---
# Served by Cilium's Gateway API implementation. IPv6 clients reach it directly;
# IPv4 clients come in through in-cluster Traefik (misc/chat-doktermarjolein.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # The talos ClusterIssuer's HTTP-01 solver looks for a Gateway named `gateway`.
  name: gateway
  annotations:
    link.argocd.argoproj.io/external-link: 'https://chat.doktermarjolein.nl'
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: "2a05:f080:0:3800:1b::5"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: open-webui-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: open-webui
spec:
  secretName: open-webui-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - chat.doktermarjolein.nl
---
# ACME HTTP-01 solver routes (exact path match) still win over this prefix match.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui-redirect
spec:
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chat.doktermarjolein.nl
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
spec:
  parentRefs:
    - name: gateway
      sectionName: https
  hostnames:
    - chat.doktermarjolein.nl
  rules:
    # Responses stream for longer than Envoy's default 15s route timeout, and
    # socket.io holds a websocket open.
    - timeouts:
        request: 0s
      backendRefs:
        - name: open-webui
          port: 8080
