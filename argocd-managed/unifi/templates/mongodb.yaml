---
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: mongodb
spec:
  members: 1
  type: ReplicaSet
  version: 8.0.6
  security:
    authentication:
      ignoreUnknownUsers: false
      modes:
        - SCRAM
  statefulSet:
    spec:
      template:
        spec:
          # replaces the operator default pod securityContext as a whole, so repeat its defaults
          securityContext:
            fsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
            seccompProfile:
              type: RuntimeDefault
          # container securityContexts are merged with the operator defaults
          # (allowPrivilegeEscalation: false, readOnlyRootFilesystem: true)
          initContainers:
            - name: mongod-posthook
              securityContext:
                capabilities:
                  drop:
                    - ALL
            - name: mongodb-agent-readinessprobe
              securityContext:
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: mongod
              resources:
                limits:
                  cpu: 1000m
                  memory: 1024Mi
              securityContext:
                capabilities:
                  drop:
                    - ALL
            - name: mongodb-agent
              securityContext:
                capabilities:
                  drop:
                    - ALL
  users:
    - name: unifi
      db: admin
      passwordSecretRef:
        name: mongo-init-pass
      scramCredentialsSecretName: unifi
      roles:
        - name: dbOwner
          db: unifi
        - name: dbOwner
          db: unifi_stat
