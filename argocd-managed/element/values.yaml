# Wrapper-chart values, consumed by templates/.
# The ESS chart only renders Ingress objects, and the Talos cluster has no
# ingress controller -- traffic enters through a Cilium Gateway instead, with
# the HTTPRoutes in templates/httproutes.yaml mirroring the chart's Ingresses.
gateway:
  # Cilium LB-IPAM address for the Gateway's LoadBalancer service.
  address: "2a05:f080:0:3800:1b::3"
  tlsSecret: matrix-tls
  # Cluster-wide HTTP-01 issuer from cert-manager's values-talos-cluster.yaml.
  # It finds the Gateway by name, which is why ours is called `gateway`.
  issuer:
    name: letsencrypt
    kind: ClusterIssuer

# CNPG cluster for Synapse and MAS, see templates/postgres.yaml.
postgres:
  name: matrix-db
  instances: 2
  image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  storageClass: local-path
  size: 10Gi
  owner: matrix

# https://github.com/element-hq/ess-helm/blob/main/charts/matrix-stack/values.yaml
matrix-stack:
  # Talos is IPv6-only. The default (dual-stack) makes HAProxy accept only IPv4
  # addresses for its backends, so it never finds Synapse.
  networking:
    ipFamily: ipv6

  # Replaced by the CNPG cluster above.
  postgres:
    enabled: false
  # Permanent: this is the domain in every user ID (@user:matrix.oscarr.nl).
  serverName: matrix.oscarr.nl

  storage:
    storageClassName: nfs-retain

  ingress:
    # TLS terminates at the Gateway.
    tlsEnabled: false
    annotations:
      # Nothing reconciles these Ingresses, so they never get a
      # loadBalancer status and would keep the app Progressing forever.
      argocd.argoproj.io/ignore-healthcheck: "true"

  synapse:
    ingress:
      host: synapse.matrix.oscarr.nl
    # Fixed ClusterIP from the static band of the service CIDR, see
    # templates/valkey.yaml. MatrixRTC still makes the chart deploy Valkey.
    redisOrValkey:
      host: "fd26:4340:84fe::10"
    # The main process is a singleton; these workers take over its client and
    # federation request handling and can run multiple replicas. HAProxy routes
    # to them, so the HTTPRoutes don't change.
    workers:
      client-reader:
        enabled: true
        replicas: 2
      synchrotron:
        enabled: true
        replicas: 2
      sliding-sync:
        enabled: true
        replicas: 2
      federation-inbound:
        enabled: true
        replicas: 2
      federation-reader:
        enabled: true
        replicas: 2
    postgres:
      host: matrix-db-rw
      port: 5432
      user: matrix
      database: synapse
      sslMode: require
      password:
        secret: matrix-db-app
        secretKey: password

  matrixAuthenticationService:
    ingress:
      host: account.matrix.oscarr.nl
    additional:
      0-sso:
        # The provider id is a fixed ULID, it is also part of the redirect
        # URI registered in Dex below. Changing it unlinks existing users.
        config: |
          upstream_oauth2:
            providers:
              - id: 01M49KAGMX5YFEJ39Q5ET5ZBZP
                human_name: IT4IT
                issuer: https://sso.matrix.oscarr.nl
                client_id: matrix
                # Public client with PKCE, so no shared secret between MAS and Dex.
                token_endpoint_auth_method: none
                pkce_method: always
                scope: openid profile email
                claims_imports:
                  localpart:
                    action: require
                    # Dex puts the SAML username attribute in `name`.
                    template: "{{ user.name }}"
                  email:
                    action: suggest
                    template: "{{ user.email }}"
    postgres:
      host: matrix-db-rw
      port: 5432
      user: matrix
      database: mas
      sslMode: require
      password:
        secret: matrix-db-app
        secretKey: password

  elementWeb:
    ingress:
      host: chat.matrix.oscarr.nl

  elementAdmin:
    ingress:
      host: admin.matrix.oscarr.nl

  matrixRTC:
    ingress:
      host: rtc.matrix.oscarr.nl
    sfu:
      # Media goes straight to this LB address, not through the Gateway.
      useStunToDiscoverPublicIP: false
      manualIP: "2a05:f080:0:3800:1b::4"
      exposedServices:
        rtcTcp:
          portType: LoadBalancer
          annotations:
            lbipam.cilium.io/ips: "2a05:f080:0:3800:1b::4"
            lbipam.cilium.io/sharing-key: matrix-rtc
        rtcMuxedUdp:
          portType: LoadBalancer
          annotations:
            lbipam.cilium.io/ips: "2a05:f080:0:3800:1b::4"
            lbipam.cilium.io/sharing-key: matrix-rtc

# https://github.com/dexidp/helm-charts/blob/master/charts/dex/values.yaml
# Separate from the Dex on k3s (auth.oscarr.nl) so the SAML login doesn't mix
# with the GitHub one. The SAML IdP only ever talks to the user's browser; the
# only back-channel is MAS -> this Dex.
dex:
  replicaCount: 2

  # Only needed for Dex's kubernetes storage.
  rbac:
    create: false

  # The matrix namespace enforces the restricted Pod Security Standard.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Dex's entrypoint renders its config to /tmp.
  volumes:
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: tmp
      mountPath: /tmp

  envVars:
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: matrix-db-app
          key: password

  httpRoute:
    enabled: true
    parentRefs:
      - name: gateway
        sectionName: https
    hostnames:
      - sso.matrix.oscarr.nl

  config:
    issuer: https://sso.matrix.oscarr.nl

    # Database from templates/postgres.yaml, $DB_PASSWORD is expanded by Dex.
    storage:
      type: postgres
      config:
        host: matrix-db-rw
        port: 5432
        database: dex
        user: matrix
        password: $DB_PASSWORD
        ssl:
          mode: require

    oauth2:
      skipApprovalScreen: true

    connectors:
      - type: saml
        id: saml
        name: IT4IT
        config:
          ssoURL: https://keycloak-staging.intern.ind.nl/realms/it4it/protocol/saml
          # Base64 PEM of the realm's signing certificate. Dex never contacts
          # Keycloak (it's internal only), this is how it verifies responses.
          caData: 
          redirectURI: https://sso.matrix.oscarr.nl/callback
          entityIssuer: https://sso.matrix.oscarr.nl/callback
          usernameAttr: username
          emailAttr: email
          # Keycloak's persistent format stores a generated id on the user,
          # which fails for read-only (LDAP) users. The username is stable too.
          nameIDPolicyFormat: unspecified

    staticClients:
      - id: matrix
        name: Matrix
        public: true
        redirectURIs:
          - https://account.matrix.oscarr.nl/upstream/callback/01M49KAGMX5YFEJ39Q5ET5ZBZP
