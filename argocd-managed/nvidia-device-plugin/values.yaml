# https://github.com/NVIDIA/k8s-device-plugin
nvidia-device-plugin: # set values for wrapper/umbrella chart
  # Talos only exposes the NVIDIA runtime through the `nvidia` RuntimeClass
  # (templates/runtimeclass.yaml); the default runc handler has no GPU access.
  # The chart's default affinity already selects nodes labelled
  # nvidia.com/gpu.present=true (set by talos5's KubeNodeConfig patch) and it
  # tolerates the nvidia.com/gpu taint, so no NFD/GFD is needed.
  runtimeClassName: nvidia
  # The chart refuses to render into `default`, which is what hack/validate-manifests.sh
  # (and CI) render with. ArgoCD always renders into nvidia-device-plugin, so this
  # only skips the guard and does not change the output.
  allowDefaultNamespace: true
