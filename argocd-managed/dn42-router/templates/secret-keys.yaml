# WireGuard private keys of the talos4 tunnels, one data key per DN42Peer
# keyRef (= peer name), moved from the SOPS-encrypted Talos patches
# (dn42-wg-*.yaml, privateKey) without being printed: sops -d | kubeseal,
# each checked against the public key recorded in its patch first.
# "autopeer" is the shared key of self-service peers (no keyRef), generated
# and sealed directly; its public key is in the dn42-autopeer values.
# Sealed for talos-cluster (scope strict: this name and namespace only).
# Add a key: kubeseal --merge-into this file with --scope strict (it writes
# JSON back; keep the file YAML).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: dn42-wireguard-keys
  namespace: dn42-router
spec:
  encryptedData:
    autopeer: 
    baragoon: 
    colby: 
    dn724: 
    gload: 
    headscarf: 
    iedon: 
    lare: 
    moe233: 
    nedifinita: 
    routedbits: 
    s6v: 
    sidereal: 
    sironeko: 
    tech9: 
    yukifia: 
    yuyuko: 
    zz: 
  template:
    metadata:
      name: dn42-wireguard-keys
      namespace: dn42-router
    type: Opaque
